version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencias
    groups:
      interface:
        patterns:
          - vite
          - "@fontsource*"
      ferramentas:
        patterns:
          - typescript
          - vitest
          - "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencias
